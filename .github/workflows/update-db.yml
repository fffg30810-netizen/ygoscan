name: Aggiorna database carte e prezzi
# Ogni lunedi' (o a mano da Actions -> Run workflow): carte nuove + prezzi freschi, poi Pages si ridistribuisce da solo.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy opencv-python-headless
      - run: python build_db.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/db.json
          git diff --cached --quiet || { git commit -m "db: carte e prezzi aggiornati $(date -u +%F)" && git push; }
